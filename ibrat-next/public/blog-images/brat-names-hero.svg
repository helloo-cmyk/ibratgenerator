<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
    
    <!-- Typographic texture pattern -->
    <pattern id="namePattern" width="600" height="300" patternUnits="userSpaceOnUse" patternTransform="rotate(-10)">
      <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#000000" opacity="0.15" letter-spacing="-0.05em">
        <text x="20" y="50" font-size="40">emily</text>
        <text x="180" y="40" font-size="70">sophia</text>
        <text x="400" y="60" font-size="30">olivia</text>
        
        <text x="80" y="120" font-size="55">liam</text>
        <text x="280" y="110" font-size="35">noah</text>
        <text x="450" y="130" font-size="80">isabella</text>
        
        <text x="10" y="200" font-size="85">mia</text>
        <text x="220" y="190" font-size="45">lucas</text>
        <text x="380" y="220" font-size="60">chloe</text>
        
        <text x="100" y="280" font-size="30">ava</text>
        <text x="260" y="270" font-size="90">ethan</text>
        <text x="500" y="290" font-size="40">mason</text>
      </g>
    </pattern>
  </defs>

  <!-- Solid Green Background -->
  <rect width="100%" height="100%" fill="#8ACE00" />
  
  <!-- Wall of Names Texture -->
  <rect width="200%" height="200%" x="-50%" y="-50%" fill="url(#namePattern)" />

  <!-- Brutalist Accent 1 (Pink) -->
  <g transform="translate(180, 150) rotate(-15)">
    <rect x="-120" y="-50" width="240" height="100" fill="#ff90e8" stroke="#000000" stroke-width="5" filter="url(#shadow)" />
    <text x="0" y="5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" letter-spacing="-0.04em" fill="#000000" text-anchor="middle" dominant-baseline="central">
      100+ NAMES
    </text>
  </g>

  <!-- Brutalist Accent 2 (White) -->
  <g transform="translate(1020, 480) rotate(12)">
    <rect x="-140" y="-50" width="280" height="100" fill="#ffffff" stroke="#000000" stroke-width="5" filter="url(#shadow)" />
    <text x="0" y="5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" letter-spacing="-0.04em" fill="#000000" text-anchor="middle" dominant-baseline="central">
      FIND YOURS
    </text>
  </g>

  <!-- The Main Centerpiece (Black Brutalist Box) -->
  <g transform="translate(600, 315) rotate(-3)">
    <!-- Hard brutalist shadow offset -->
    <rect x="-380" y="-130" width="760" height="260" fill="#000000" />
    
    <!-- White border box -->
    <rect x="-400" y="-150" width="760" height="260" fill="#000000" stroke="#ffffff" stroke-width="6" />
    
    <!-- Inverted Blurred Text (Green text on Black box) -->
    <text x="-20" y="10" font-family="Arial, Helvetica, sans-serif" font-weight="normal" font-size="150" letter-spacing="-0.05em" fill="#8ACE00" text-anchor="middle" dominant-baseline="central" filter="url(#blur)">
      names list
    </text>
  </g>

  <!-- Decorative Tech Crosshairs -->
  <path d="M 40 40 L 100 40 M 70 10 L 70 70" stroke="#000000" stroke-width="4" />
  <path d="M 1100 40 L 1160 40 M 1130 10 L 1130 70" stroke="#000000" stroke-width="4" />
  <path d="M 40 590 L 100 590 M 70 560 L 70 620" stroke="#000000" stroke-width="4" />
  <path d="M 1100 590 L 1160 590 M 1130 560 L 1130 620" stroke="#000000" stroke-width="4" />

</svg>