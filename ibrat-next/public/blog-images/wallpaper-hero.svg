<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="deep-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#111111" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Back Left Panel (Pink) -->
  <g transform="translate(380, 100) rotate(-15)" filter="url(#soft-shadow)">
    <rect x="-150" y="0" width="300" height="533" rx="32" fill="#ff90e8" stroke="#111111" stroke-width="2" />
    <text x="0" y="266" font-family="Arial, Helvetica, sans-serif" font-weight="normal" font-size="60" letter-spacing="-0.04em" fill="#111111" text-anchor="middle" dominant-baseline="central" filter="url(#blur)">
      girly
    </text>
  </g>

  <!-- Back Right Panel (Black) -->
  <g transform="translate(820, 100) rotate(15)" filter="url(#soft-shadow)">
    <rect x="-150" y="0" width="300" height="533" rx="32" fill="#0a0a0a" stroke="#333333" stroke-width="2" />
    <text x="0" y="266" font-family="Arial, Helvetica, sans-serif" font-weight="normal" font-size="60" letter-spacing="-0.04em" fill="#ffffff" text-anchor="middle" dominant-baseline="central" filter="url(#blur)">
      villain
    </text>
  </g>

  <!-- Front Center Panel (Brat Green) -->
  <g transform="translate(600, 50)" filter="url(#deep-shadow)">
    <rect x="-160" y="0" width="320" height="568" rx="36" fill="#89CC04" stroke="#111111" stroke-width="2" />
    <text x="0" y="284" font-family="Arial, Helvetica, sans-serif" font-weight="normal" font-size="80" letter-spacing="-0.04em" fill="#111111" text-anchor="middle" dominant-baseline="central" filter="url(#blur)">
      brat
    </text>
  </g>

  <!-- Top Left Badge -->
  <g transform="translate(180, 150) rotate(-8)" filter="url(#soft-shadow)">
    <rect x="-120" y="-40" width="240" height="80" rx="40" fill="#ffffff" />
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="28" letter-spacing="-0.03em" fill="#111111" text-anchor="middle" dominant-baseline="central">
      9:16 format
    </text>
  </g>

  <!-- Bottom Right Badge -->
  <g transform="translate(1020, 480) rotate(6)" filter="url(#soft-shadow)">
    <rect x="-140" y="-40" width="280" height="80" rx="40" fill="#89CC04" />
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="28" letter-spacing="-0.03em" fill="#111111" text-anchor="middle" dominant-baseline="central">
      lock screen
    </text>
  </g>

</svg>
