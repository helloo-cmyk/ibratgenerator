<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="1.2" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#111111" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Window 1 (Back Left - Pink) -->
  <g transform="translate(320, 220) rotate(-6)" filter="url(#shadow)">
    <rect x="-230" y="-150" width="460" height="300" rx="16" fill="#ff90e8" stroke="#111111" stroke-width="4" />
    <line x1="-230" y1="-90" x2="230" y2="-90" stroke="#111111" stroke-width="4" />
    
    <circle cx="-190" cy="-120" r="7" fill="none" stroke="#111111" stroke-width="3" />
    <circle cx="-160" cy="-120" r="7" fill="none" stroke="#111111" stroke-width="3" />
    <circle cx="-130" cy="-120" r="7" fill="none" stroke="#111111" stroke-width="3" />
    
    <text x="0" y="5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="52" letter-spacing="-0.04em" fill="#111111" text-anchor="middle" dominant-baseline="central">
      no signup
    </text>
    
    <rect x="-80" y="60" width="160" height="10" rx="5" fill="#111111" opacity="0.15" />
    <rect x="-40" y="85" width="80" height="10" rx="5" fill="#111111" opacity="0.15" />
  </g>

  <!-- Window 2 (Back Right - White) -->
  <g transform="translate(880, 230) rotate(8)" filter="url(#shadow)">
    <rect x="-230" y="-150" width="460" height="300" rx="16" fill="#ffffff" stroke="#111111" stroke-width="4" />
    <line x1="-230" y1="-90" x2="230" y2="-90" stroke="#111111" stroke-width="4" />
    
    <circle cx="-190" cy="-120" r="7" fill="none" stroke="#111111" stroke-width="3" />
    <circle cx="-160" cy="-120" r="7" fill="none" stroke="#111111" stroke-width="3" />
    <circle cx="-130" cy="-120" r="7" fill="none" stroke="#111111" stroke-width="3" />
    
    <text x="0" y="5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="52" letter-spacing="-0.04em" fill="#111111" text-anchor="middle" dominant-baseline="central">
      100% free
    </text>
    
    <rect x="-80" y="60" width="160" height="10" rx="5" fill="#111111" opacity="0.15" />
    <rect x="-40" y="85" width="80" height="10" rx="5" fill="#111111" opacity="0.15" />
  </g>

  <!-- Window 3 (Front Center - Green) -->
  <g transform="translate(600, 410) rotate(-2)" filter="url(#shadow)">
    <rect x="-310" y="-180" width="620" height="360" rx="16" fill="#89CC04" stroke="#111111" stroke-width="4" />
    <line x1="-310" y1="-120" x2="310" y2="-120" stroke="#111111" stroke-width="4" />
    
    <circle cx="-260" cy="-150" r="9" fill="none" stroke="#111111" stroke-width="3" />
    <circle cx="-225" cy="-150" r="9" fill="none" stroke="#111111" stroke-width="3" />
    <circle cx="-190" cy="-150" r="9" fill="none" stroke="#111111" stroke-width="3" />
    
    <text x="0" y="20" font-family="Arial, Helvetica, sans-serif" font-weight="normal" font-size="105" letter-spacing="-0.05em" fill="#111111" text-anchor="middle" dominant-baseline="central" filter="url(#blur)">
      best tools
    </text>
    
    <rect x="-120" y="90" width="240" height="12" rx="6" fill="#111111" opacity="0.15" />
    <rect x="-60" y="120" width="120" height="12" rx="6" fill="#111111" opacity="0.15" />
  </g>
</svg>